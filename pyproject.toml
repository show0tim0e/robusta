[project]
name = "js2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "adversarial-robustness-toolbox>=1.20.1",
    "pytest>=9.1.0",
    "pytest-asyncio",
    "ruff>=0.15.17",
    "textual>=8.2.7",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "transformers>=4.0.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.34.0",
]

[tool.ruff]
line-length = 1000
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]